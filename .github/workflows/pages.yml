name: Deploy app + docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build app
        working-directory: webui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs into the app artifact (/docs/)
        run: |
          pip install "mkdocs-material>=9.7,<10"
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webui/dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
